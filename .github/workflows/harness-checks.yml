name: Decision harness

on:
  push:
    paths: ['skills/**', 'tools/**', 'tests/**', 'docs/**', 'evals/**', 'examples/factory_analysis/**', '.agents/skills/**', '.claude/skills/**', 'AGENTS.md', 'CLAUDE.md', 'README.md', '.gitignore', 'pyproject.toml', 'uv.lock', '.github/workflows/harness-checks.yml']
  pull_request:
    paths: ['skills/**', 'tools/**', 'tests/**', 'docs/**', 'evals/**', 'examples/factory_analysis/**', '.agents/skills/**', '.claude/skills/**', 'AGENTS.md', 'CLAUDE.md', 'README.md', '.gitignore', 'pyproject.toml', 'uv.lock', '.github/workflows/harness-checks.yml']

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/render_skills.py --check
      - run: python -m unittest discover -s tests -v
  example-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.20'
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --no-dev
      - run: uv run --locked --no-dev python -m unittest discover -s examples/factory_analysis/tests -v
      - run: uv run --locked --no-dev python -m examples.factory_analysis demo --out /tmp/factory-ci
