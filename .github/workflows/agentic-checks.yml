name: Agentic decision analysis

on:
  push:
    paths: ['agentic/**', '.agents/skills/decision-analysis/**', '.claude/skills/decision-analysis/**', 'AGENTS.md', 'CLAUDE.md', 'pyproject.toml', 'uv.lock', '.github/workflows/agentic-checks.yml']
  pull_request:
    paths: ['agentic/**', '.agents/skills/decision-analysis/**', '.claude/skills/decision-analysis/**', 'AGENTS.md', 'CLAUDE.md', 'pyproject.toml', 'uv.lock', '.github/workflows/agentic-checks.yml']

permissions:
  contents: read

jobs:
  evidence-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.20'
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --no-dev
      - run: uv run --locked --no-dev python -m unittest discover -s agentic/tests -v
      - run: uv run --locked --no-dev python -m agentic demo --out /tmp/decision-ci
